<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c110a"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe2a3"/>
      <stop offset="50%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#d47926"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Espresso Rounded Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#ffb454" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Cyber Scanline subtle grid effect -->
  <line x1="1" y1="16" x2="63" y2="16" stroke="#ffb454" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="1" y1="32" x2="63" y2="32" stroke="#ffb454" stroke-width="0.5" stroke-opacity="0.08"/>
  <line x1="1" y1="48" x2="63" y2="48" stroke="#ffb454" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- Steaming Vapor (Warm Amber Curves) -->
  <g filter="url(#glow)">
    <path d="M22 19 C20 15, 25 12, 22 8" fill="none" stroke="url(#amberGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M30 19 C28 14, 34 11, 30 7" fill="none" stroke="url(#amberGrad)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M38 19 C36 15, 41 12, 38 8" fill="none" stroke="url(#amberGrad)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Cup Body & Handle -->
  <g filter="url(#glow)">
    <!-- Cup -->
    <path d="M16 23 L44 23 C44 23 43 41 30 41 C17 41 16 23 16 23 Z" fill="url(#amberGrad)"/>
    <!-- Dark Inner Rim -->
    <ellipse cx="30" cy="23.5" rx="13" ry="2.2" fill="#2d1609"/>
    <ellipse cx="30" cy="23.5" rx="11" ry="1.4" fill="#140904"/>

    <!-- Cup Handle -->
    <path d="M43 26 C48 26 51 28 51 32 C51 36 47 38 41 38" fill="none" stroke="url(#amberGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Saucer / Base -->
    <path d="M14 44 C22 47 38 47 46 44" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="47" x2="40" y2="47" stroke="#ffb454" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- Terminal Prompt ">" inside the cup body -->
    <path d="M26 29 L31 32 L26 35" fill="none" stroke="#120703" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="33" y1="35" x2="36" y2="35" stroke="#120703" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
